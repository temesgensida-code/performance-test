global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "social-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-cache"
    static_configs:
      - targets: ["redis-cache-exporter:9121"]

  - job_name: "redis-broker"
    static_configs:
      - targets: ["redis-broker-exporter:9121"]
